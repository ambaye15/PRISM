[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-smm"
version = "0.4.2.post2"
description = "Interpretable measurements of stereotypical motion and synthetic profile exemplars"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Austin Amadou MBaye"}]
dependencies = [
  "numpy>=1.26.4,<2",
  "scipy>=1.11,<2",
  "pandas>=2.2,<3",
  "opencv-python-headless>=4.10,<5",
  "ripser>=0.6.12,<0.7",
  "Pillow>=10"
]

[project.optional-dependencies]
controls = ["matplotlib>=3.8,<4"]
plotting = ["matplotlib>=3.8,<4"]
validation = [
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "skeleton-lab @ git+https://github.com/vik1000-coder/skeleton-lab.git@207c9ad39f43163739f96a2eb0467f2e5d466ef4"
]
exemplars = [
  "scikit-learn==1.8.0",
  "threadpoolctl>=3.2",
  "matplotlib>=3.8,<4",
  "imageio>=2.38,<3",
  "imageio-ffmpeg>=0.6,<1",
  "psutil>=7",
  "skeleton-lab @ git+https://github.com/vik1000-coder/skeleton-lab.git@207c9ad39f43163739f96a2eb0467f2e5d466ef4"
]
paper = [
  "scikit-learn==1.8.0",
  "threadpoolctl>=3.2",
  "matplotlib>=3.8,<4",
  "imageio>=2.38,<3",
  "imageio-ffmpeg>=0.6,<1",
  "psutil>=7",
  "PyYAML>=6,<7",
  "statsmodels>=0.14,<1",
  "seaborn>=0.13,<1",
  "skeleton-lab @ git+https://github.com/vik1000-coder/skeleton-lab.git@207c9ad39f43163739f96a2eb0467f2e5d466ef4"
]
pose = ["ultralytics>=8.3,<9", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
prism-flow = "prism.run_optical_flow:main"
prism-topology = "prism.run_sliding_window_topology:main"
prism-assemble = "prism.assemble_prism_features:main"
prism-exemplars = "prism.exemplars.cli:main"
prism-case-studies = "prism.analysis.real_video:main"
prism-matched-controls = "prism.validation.matched_controls.cli:main"

[tool.setuptools.packages.find]
include = ["prism", "prism.*"]
exclude = ["tests*", "scripts*", "tools*"]

[tool.setuptools.package-data]
"prism.exemplars" = [
  "assets/specs/*.json",
  "assets/reference/*",
  "assets/reference/records/*.json",
  "assets/reference/query_example/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
