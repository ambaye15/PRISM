# Frequency x amplitude x jitter grid on arm flapping, three seeds each.
#
# The point of this grid is to separate the two channels the measurement
# pipeline might be responding to: frequency and amplitude are varied
# independently, and keypoint jitter is layered on top so the same motion can be
# measured at three noise levels.
#
# From the standalone project root:
#   python -m skeleton_lab sweep examples/sweeps/frequency_amplitude_grid.yaml \
#       --out output/freq_amp --jobs 2
#
# 4 x 3 x 3 cells x 3 seeds = 108 clips of 20 s.  Use --dry-run first.
base: examples/specs/arm_flapping.json
duration_sec: 20
name_template: "flap_f{drives[flap].frequency.value}_A{drives[flap].amplitude.tracks[1].value}_j{measurement.jitter.sigma_px}"
grid:
  # Mutate the scalar leaves, not the enclosing tracks: replacing the
  # ProductTrack amplitude would silently discard its 10--90% bout gate.
  drives[flap].frequency.value: [1.0, 2.0, 3.0, 4.0]
  drives[flap].amplitude.tracks[1].value: [10, 25, 45]
  measurement.jitter.sigma_px: [0, 4, 12]
seeds: [0, 1, 2]
